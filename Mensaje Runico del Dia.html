<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0805;
    color: #e8d5a0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
  }
  .stars {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(180,130,40,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(100,60,160,0.06) 0%, transparent 50%),
      #0a0805;
    z-index:0; pointer-events:none;
  }
  .stars::before {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,220,120,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 8%,  rgba(255,220,120,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 72% 15%, rgba(255,220,120,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 35%, rgba(255,220,120,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 55%, rgba(255,220,120,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 45%, rgba(255,220,120,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 75%, rgba(255,220,120,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 80%, rgba(255,220,120,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 90%, rgba(255,220,120,0.4) 0%, transparent 100%);
  }
  .page {
    max-width: 680px; margin: 0 auto;
    padding: 40px 28px 60px;
    position: relative; z-index:1;
  }
  .site-name {
    text-align: center;
    font-size: 21px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(200,160,60,0.45);
    margin-bottom: 10px;
    opacity:0; animation: fadeUp .7s ease forwards;
  }
  .date-badge {
    display: block; text-align: center;
    font-size: 22px; letter-spacing: 3px;
    color: rgba(200,160,60,0.55);
    border: 1px solid rgba(200,160,60,0.18);
    padding: 5px 20px; border-radius: 20px;
    width: fit-content; margin: 0 auto 32px;
    opacity:0; animation: fadeUp .7s ease .1s forwards;
  }
  .divider {
    display:flex; align-items:center; gap:12px;
    margin-bottom: 36px;
    opacity:0; animation: fadeUp .7s ease .15s forwards;
  }
  .divider-line { flex:1; height:1px; background: linear-gradient(90deg, transparent, rgba(200,160,60,0.35), transparent); }
  .divider-glyph { color: rgba(200,160,60,0.45); font-size:16px; }

  /* Círculo */
  .rune-center {
    text-align: center; margin-bottom: 28px;
    opacity:0; animation: fadeUp .8s ease .2s forwards;
  }
  .rune-circle-outer {
    width:180px; height:180px; border-radius:50%;
    border:2px solid transparent;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto;
    position:relative;
    background: transparent;
    animation: spinGlow 6s linear infinite;
  }
  .rune-circle-outer::before {
    content:'';
    position:absolute; inset:-2px;
    border-radius:50%;
    background: conic-gradient(
      rgba(200,160,60,0) 0deg,
      rgba(200,160,60,0.9) 60deg,
      rgba(255,220,100,1) 90deg,
      rgba(200,160,60,0.9) 120deg,
      rgba(200,160,60,0) 180deg,
      rgba(200,160,60,0) 360deg
    );
    animation: spinGlow 6s linear infinite;
    border-radius:50%;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), white calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), white calc(100% - 3px));
  }
  .rune-circle-outer::after {
    content:'';
    position:absolute; inset:-10px;
    border-radius:50%;
    background: conic-gradient(
      rgba(200,160,60,0) 0deg,
      rgba(200,160,60,0.15) 60deg,
      rgba(200,160,60,0.35) 90deg,
      rgba(200,160,60,0.15) 120deg,
      rgba(200,160,60,0) 180deg,
      rgba(200,160,60,0) 360deg
    );
    animation: spinGlow 6s linear infinite;
    filter: blur(8px);
    border-radius:50%;
  }
  @keyframes spinGlow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .rune-circle-inner {
    width:144px; height:144px; border-radius:50%;
    border:1px solid rgba(200,160,60,0.2);
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse, rgba(200,160,60,0.07) 0%, transparent 70%);
    position:relative; z-index:1;
  }
  .rune-symbol {
    font-size:121px; line-height:1; color:#c8a03c;
    text-shadow: 0 0 20px rgba(200,160,60,0.6), 0 0 60px rgba(200,160,60,0.2);
    animation: none;
    display:inline-block;
  }
  .rune-name-display {
    font-family: Arial Black, Arial, sans-serif;
    font-size: 22px; font-weight:900; letter-spacing:6px;
    color:#c8a03c; text-transform:uppercase;
    text-shadow: 0 0 30px rgba(200,160,60,0.25);
    margin-top: 18px;
  }

  /* Caja del mensaje */
  .msg-wrapper {
    opacity:0; animation: fadeUp .8s ease .35s forwards;
  }
  .msg-label {
    font-size:20px; letter-spacing:5px; text-transform:uppercase;
    color:rgba(200,160,60,0.4); text-align:center;
    margin-bottom: 20px;
  }
  .msg-box {
    position:relative;
    border:1px solid rgba(200,160,60,0.2);
    background: rgba(200,160,60,0.04);
    padding: 32px 28px;
  }
  .msg-box::before, .msg-box::after {
    content:''; position:absolute;
    width:18px; height:18px;
    border-color:rgba(200,160,60,0.5); border-style:solid;
  }
  .msg-box::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .msg-box::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
  .msg-text {
    font-size:19px; line-height:1.8; color:#d4b060;
    text-align:center; font-style:italic;
    text-shadow: 0 0 25px rgba(200,160,60,0.15);
  }
  .msg-text::before { content:'\201C'; }
  .msg-text::after  { content:'\201D'; }

  .ornament {
    display:flex; align-items:center; gap:10px;
    margin: 28px 0;
    opacity:0; animation: fadeUp .7s ease .28s forwards;
  }
  .ornament-line { flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(200,160,60,0.3), transparent); }
  .ornament-sym { font-size:16px; color:rgba(200,160,60,0.4); }

  .error-state {
    text-align:center; padding:40px 20px;
    color:rgba(200,160,60,0.4); font-size:14px; letter-spacing:2px;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes rotateSlow {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }
  @keyframes runeRotate3D {
    0%   { transform: rotateY(0deg);   text-shadow: 0 0 20px rgba(200,160,60,0.6), 0 0 60px rgba(200,160,60,0.2); }
    25%  { transform: rotateY(90deg);  text-shadow: 0 0 5px  rgba(200,160,60,0.2); }
    50%  { transform: rotateY(180deg); text-shadow: 0 0 20px rgba(200,160,60,0.6), 0 0 60px rgba(200,160,60,0.2); }
    75%  { transform: rotateY(270deg); text-shadow: 0 0 5px  rgba(200,160,60,0.2); }
    100% { transform: rotateY(360deg); text-shadow: 0 0 20px rgba(200,160,60,0.6), 0 0 60px rgba(200,160,60,0.2); }
  }
  @keyframes glow {
    0%,100% { text-shadow:0 0 20px rgba(200,160,60,0.6),0 0 60px rgba(200,160,60,0.2); }
    50%      { text-shadow:0 0 30px rgba(200,160,60,0.9),0 0 80px rgba(200,160,60,0.4); }
  }

  /* ── Responsive móvil ─────────────────────────────────────────────── */
  @media (max-width: 480px) {
    .page {
      padding: 28px 18px 48px;
    }
    .site-name {
      font-size: 15px; letter-spacing: 4px;
    }
    .date-badge {
      font-size: 15px; letter-spacing: 2px;
      padding: 5px 14px;
    }
    .rune-circle-outer {
      width: 150px; height: 150px;
    }
    .rune-circle-inner {
      width: 118px; height: 118px;
    }
    .rune-symbol {
      font-size: 90px;
    }
    .rune-name-display {
      font-size: 17px; letter-spacing: 4px;
    }
    .msg-label {
      font-size: 14px; letter-spacing: 3px;
    }
    .msg-text {
      font-size: 16px; line-height: 1.7;
    }
    .msg-box {
      padding: 24px 18px;
    }
  }

  @media (max-width: 360px) {
    .site-name { font-size: 13px; letter-spacing: 3px; }
    .date-badge { font-size: 13px; }
    .rune-circle-outer { width: 130px; height: 130px; }
    .rune-circle-inner { width: 102px; height: 102px; }
    .rune-symbol { font-size: 76px; }
    .msg-text { font-size: 15px; }
  }

</style>
</head>

</div>

  Isa: [
    "El hielo detiene el movimiento para que puedas ver con claridad lo que el ruido ocultaba. Hoy Isa te regala quietud.",
    "No toda pausa es pérdida. Isa te muestra que en la inmovilidad hay sabiduría que el movimiento no puede enseñar.",
    "Hoy el universo te pide que te detengas. No es un obstáculo, es una invitación a observar antes de actuar.",
    "El hielo preserva. Isa protege lo valioso mientras el tiempo hace su trabajo. Confía en la espera de hoy.",
    "La claridad llega en el silencio. Isa disuelve el ruido externo para que puedas escuchar la voz que importa.",
    "Un período de consolidación interior es tan valioso como uno de acción exterior. Hoy Isa honra lo invisible.",
    "No fuerces lo que está congelado. Isa te recuerda que hay cosas que solo el tiempo puede descongelar suavemente.",
    "La soledad de hoy no es abandono, es un retiro sagrado. Isa cuida del espacio donde vas a encontrarte a ti mismo.",
    "Hoy observa más y habla menos. Isa agudiza la percepción de quien tiene el coraje de quedarse quieto.",
    "El invierno no es el fin del jardín, es su descanso necesario. Hoy Isa honra tu propio invierno interior.",
    "Cuando todo se frena, lo esencial se vuelve evidente. Hoy Isa te muestra qué en tu vida es realmente importante.",
    "La concentración que necesitas hoy viene de adentro. Isa calma el ruido mental para que puedas enfocarte en lo que importa.",
    "Hay una respuesta que llegará cuando dejes de buscarla ansiosamente. Isa te enseña el arte de la espera activa.",
    "El hielo de Isa va cediendo. Algo que estuvo detenido comenzará a moverse pronto. Prepárate con suavidad.",
    "El ciclo de Isa cierra. Llevas la paz que encontraste en la quietud. Ese centro de calma es tuyo para siempre."
  ],
  Jera: [
    "Jera te recuerda: no puedes cosechar lo que no sembraste, ni más rápido de lo que la naturaleza permite. Confía en el tiempo.",
    "Cada ciclo completo es una victoria. Hoy Jera celebra los procesos que honraste aunque nadie los viera.",
    "La rueda del año gira sin prisa y sin pausa. Hoy Jera te invita a sincronizarte con ese ritmo sabio y paciente.",
    "Lo que plantaste con amor en ciclos anteriores está creciendo ahora, aunque aún no lo veas. Jera lo sabe.",
    "Hoy puede traer el inicio de una cosecha que llevas tiempo esperando. Jera anuncia: el tiempo correcto ha llegado.",
    "Los ciclos de la naturaleza no se negocian. Jera te enseña la humildad de quien sabe que no lo controla todo.",
    "La paciencia de Jera no es pasiva: es la energía activa de quien cuida, riega y espera sin angustia.",
    "Un año de trabajo merece reconocimiento. Hoy Jera te pide que celebres lo que has construido, aunque falte mucho.",
    "Estás en el momento exacto del ciclo en que debes estar. Jera confirma: ni adelantado ni atrasado. En tu tiempo.",
    "Las estaciones cambian sin que nadie les pida permiso. Hoy Jera te invita a fluir con el cambio que viene.",
    "El esfuerzo sostenido en el tiempo tiene su recompensa. Jera es la runa de la justicia cósmica del trabajo honesto.",
    "Algo que comenzaste hace meses llega hoy a un punto de madurez. Jera marca los hitos aunque parezcan ordinarios.",
    "La sabiduría de los ciclos es que siempre hay una nueva primavera. Hoy Jera te recuerda que esto también pasará.",
    "El solsticio de invierno llega con Jera: el punto de mayor oscuridad que anuncia el regreso de la luz. Confía.",
    "El ciclo de Jera cierra en el corazón del invierno. Lleva la certeza de quien sabe que la cosecha siempre regresa."
  ],
  Eihwaz: [
    "El tejo vive mil años porque sus raíces son tan profundas como sus ramas son altas. Hoy Eihwaz te pide que te arraigues.",
    "Entre la vida y la muerte hay un espacio sagrado. Eihwaz te invita a habitarlo sin miedo: ahí vive la transformación real.",
    "Lo que parece el fin es solo el umbral de algo diferente. Eihwaz acompaña los tránsitos que asustan pero liberan.",
    "Tu perseverancia no es testarudez, es la sabiduría del árbol que se dobla en la tormenta pero no se rompe.",
    "Eihwaz conecta los mundos. Hoy puedes recibir orientación de fuentes inesperadas: sueños, intuiciones, señales.",
    "El axis mundi que eres tú conecta tu pasado y tu futuro en este momento presente. Hoy Eihwaz honra ese eje.",
    "Las raíces ancestrales te sostienen aunque no las veas. Hoy Eihwaz te conecta con la fortaleza de quienes vinieron antes.",
    "Lo que resiste el tiempo no es lo más duro, sino lo más flexible. Hoy Eihwaz te enseña la fuerza de la adaptación.",
    "Estás en un punto de transición. Eihwaz te sostiene en el entre-medio, donde lo viejo ya se fue y lo nuevo aún no llega.",
    "El tejo tóxico para los que no lo conocen, medicinal para quienes saben usarlo. Hoy Eihwaz pregunta: ¿qué en ti tiene ese doble poder?",
    "La muerte de lo que ya no sirve es un acto de amor propio. Eihwaz te da el coraje para soltar con dignidad.",
    "Hoy la perseverancia vale más que la inspiración. Eihwaz te respalda cuando sigues aunque no sientas ganas.",
    "Tu historia de vida tiene raíces más profundas de lo que imaginas. Hoy Eihwaz te invita a honrar de dónde vienes.",
    "El umbral entre años está cerca. Eihwaz lo guarda. Todo lo que cruzas ahora tiene el peso sagrado de los finales reales.",
    "Eihwaz cierra el año viejo. Eres el árbol que atravesó la tormenta: más enraizado, más sabio, más vivo que nunca."
  ],
  Pertho: [
    "El cubilete de los dados guarda el misterio del destino. Hoy Pertho te invita a soltar la necesidad de controlar el resultado.",
    "Lo que está oculto saldrá a la luz en el momento exacto. Pertho guarda los secretos hasta que estés listo para verlos.",
    "El azar no existe para Pertho. Lo que parece suerte es el patrón del tejido de tu vida haciéndose visible.",
    "Hoy puede revelarse algo que estaba escondido. Pertho abre lo que estaba cerrado cuando el tiempo es el correcto.",
    "Tu destino no está fijo. Pertho juega con la posibilidad: cada elección que haces lanza los dados de nuevo.",
    "Hay algo que aún no sabes sobre esta situación. Pertho te pide paciencia antes de juzgar o decidir.",
    "El misterio no es una amenaza, es una invitación a la curiosidad. Hoy Pertho te enseña a amar lo que aún no comprendes.",
    "Las coincidencias de hoy son mensajes cifrados. Pertho agudiza tu capacidad de leer los signos que el universo te envía.",
    "Lo que el destino tiene guardado para ti supera lo que tu mente podría imaginar. Pertho susurra: confía en la sorpresa.",
    "Un secreto puede salir a la luz hoy. Pertho lo hace con la precisión de quien sabe que la verdad siempre encuentra su momento.",
    "Suelta el guión de cómo deberían ser las cosas. Pertho trabaja mejor cuando le dejas espacio para sorprenderte.",
    "Hoy los sueños pueden traer mensajes importantes. Pertho habla en el lenguaje del subconsciente. Escúchalo.",
    "La suerte se inclina hacia quienes están presentes y abiertos. Hoy Pertho te pide que estés aquí, en este momento.",
    "Lo que llevas tiempo esperando se mueve hoy, aunque aún no lo veas. Pertho lo confirma: algo está cambiando.",
    "El ciclo de Pertho cierra. Llevas contigo el regalo de haber aprendido a vivir con el misterio sin que te paralice."
  ],
  Algiz: [
    "El alce levanta sus astas y nada se atreve a acercarse. Hoy Algiz te pide que pongas en alto tu energía de protección.",
    "Estás más protegido de lo que crees. Algiz rodea de luz tu camino de hoy. Avanza con confianza.",
    "Tu instinto de protección es una forma de sabiduría divina. Hoy Algiz amplifica esa antena que detecta lo que no está bien.",
    "Hay momentos en que alejarse no es cobardía, es inteligencia. Algiz hoy te da permiso de protegerte.",
    "La conexión con lo sagrado es tu escudo más poderoso. Hoy Algiz te invita a renovar ese vínculo con tu fuente de luz.",
    "Protege tu energía hoy. No todas las personas merecen acceso a tu espacio interior. Algiz cuida tus fronteras.",
    "Tu intuición sobre cierta persona o situación merece ser escuchada. Algiz no lanza falsas alarmas.",

    "Estar alerta no es vivir con miedo. Algiz te enseña la vigilancia consciente que viene de la presencia, no del terror.",
    "Un ángel o guía puede hacerse sentir hoy de manera sutil. Algiz abre ese canal de comunicación sagrada.",
    "Confía en la red invisible de apoyo que te sostiene. Algiz te recuerda que nunca estás solo en este camino.",
    "Hoy es un buen día para hacer rituales de protección, limpiar tu espacio y renovar tus intenciones de luz.",
    "La fuerza de Algiz no intimidó porque no necesitaba hacerlo. Hoy sé esa presencia que cuida sin necesitar demostrar nada.",
    "El ciclo de Algiz cierra. Llevas contigo el escudo que construiste: tu conciencia, tu instinto y tu conexión con lo divino."
  ],
  Sowilo: [
    "El sol rompe las nubes después de la tormenta más larga. Hoy Sowilo anuncia: la luz es tuya, merécela plenamente.",
    "Tu victoria no fue suerte. Sowilo reconoce el trabajo interior que hiciste para llegar hasta aquí. Celebra.",
    "Hoy tienes permiso de brillar sin disculparte. Sowilo celebra tu luz como un regalo al mundo, no como arrogancia.",
    "El rayo de sol no pide permiso para iluminar. Hoy tú tampoco necesitas pedirlo para ser quien realmente eres.",
    "La energía solar de Sowilo recarga tu vitalidad. Hoy siente cómo el entusiasmo regresa a tus proyectos y a tu vida.",
    "El éxito de hoy es la cosecha de la fe que mantuviste en los momentos oscuros. Sowilo honra esa perseverancia.",
    "Hoy puedes ver con claridad solar lo que antes estaba nublado. Sowilo ilumina decisiones y caminos con precisión.",
    "El sol es generoso: da su luz a todos por igual. Hoy Sowilo te invita a ser igual de generoso con tu alegría.",

    "Tu propósito brilla más claro que nunca. Hoy Sowilo te conecta con esa certeza de saber para qué estás aquí.",

    "Hoy es un día poderoso para iniciar, para decidir, para mostrarte. Sowilo ilumina los nuevos comienzos con fuerza.",
    "El sol también se pone, pero siempre vuelve. Sowilo te enseña que tus ciclos de luz siempre regresan más intensos.",
    "Hay algo en tu vida que está floreciendo bajo la luz de Sowilo. Hoy ponle atención y nómbralo con gratitud.",
    "El ciclo de Sowilo cierra. Llevas la luz solar dentro: esa certeza de que eres capaz, que mereces y que puedes."
  ],
  Tiwaz: [
    "Tyr sacrificó su mano para que el mundo estuviera a salvo. Hoy Tiwaz pregunta: ¿qué estás dispuesto a sacrificar por lo que es correcto?",
    "La justicia de Tiwaz no es venganza, es equilibrio. Hoy actúa desde ese lugar de ecuanimidad que honra a todos.",
    "El guerrero de Tiwaz no lucha por gloria, lucha por principios. Hoy identifica cuáles son los tuyos y defiéndelos.",
    "Hay una decisión difícil que ya conoces la respuesta correcta. Tiwaz te da el coraje para tomarla hoy.",
    "El honor no se negocia. Hoy Tiwaz te invita a actuar de acuerdo a quien dices que eres, aunque nadie esté mirando.",
    "La verdad dicha con valentía, aunque duela, es un acto de amor. Hoy Tiwaz te da esa valentía.",
    "Luchar por algo más grande que uno mismo da un sentido que ningún éxito personal puede igualar. Tiwaz lo sabe.",
    "La disciplina de Tiwaz no es rigidez, es la fuerza de quien se compromete y cumple. Hoy honra tus compromisos.",
    "Una injusticia que has estado viendo merece tu voz. Tiwaz dice: el silencio también es una elección. Elige con conciencia.",
    "El guerrero también sabe cuándo no luchar. Hoy Tiwaz te da discernimiento para saber cuándo conservar fuerzas.",
    "Tu integridad es tu reputación más valiosa. Hoy Tiwaz te recuerda que lo que haces cuando nadie mira te define.",
    "Una causa que merece tu energía te llama hoy. Tiwaz amplifica el poder de quien actúa desde la convicción.",
    "La justicia cósmica siempre se equilibra. Hoy Tiwaz te pide que confíes en ese proceso aunque no lo veas aún.",
    "El sacrificio de hoy tiene un propósito mayor que el momento presente. Tiwaz lo ve con claridad, aunque tú aún no.",
    "El ciclo de Tiwaz cierra. Has luchado con honor. Llevas el escudo del guerrero que sabe que la verdad siempre prevalece."
  ],
  Berkana: [
    "El abedul renace cada primavera sin importar cuán duro fue el invierno. Hoy Berkana anuncia: algo nuevo está naciendo en ti.",
    "La madre que nutre sabe que el amor verdadero da espacio para crecer. Hoy Berkana te enseña ese amor sin control.",
    "Un proyecto, relación o idea que está en sus primeras etapas necesita ternura, no presión. Berkana cuida los inicios.",
    "Hoy es un día para sembrar. Berkana bendice los nuevos comienzos con su energía de fertilidad y crecimiento.",
    "La regeneración que promete Berkana no siempre es visible. Pero bajo la tierra, las raíces nuevas ya están creciendo.",
    "Cuídate hoy como lo harías con un ser querido. Berkana te recuerda que la compasión propia también es sagrada.",
    "La primavera interior llega cuando decides comenzar de nuevo. Berkana acompaña cada nuevo inicio sin juzgar los anteriores.",
    "Tu capacidad de dar vida a ideas y proyectos es un don. Hoy Berkana amplifica esa fuerza creadora que te habita.",
    "Hay algo tierno y nuevo que necesita tu protección. Berkana te da la sensibilidad para reconocerlo y cuidarlo.",
    "El perdón es también un renacimiento. Hoy Berkana te invita a soltar viejas heridas y darle espacio a algo más verde.",

    "Hoy honra a las mujeres que te formaron, a las madres de tu linaje. Berkana conecta ese hilo invisible de amor.",
    "Un ciclo de crecimiento personal llega a un punto de floración. Berkana celebra contigo este momento de plenitud.",
    "La naturaleza siempre encuentra la forma de crecer, incluso en las grietas del asfalto. Hoy Berkana te da esa misma tenacidad.",
    "El ciclo de Berkana cierra. Te vas más suave, más fértil, más capaz de dar vida a lo que realmente te importa."
  ],
  Ehwaz: [
    "El caballo y su jinete son uno solo cuando hay confianza plena. Hoy Ehwaz pregunta: ¿en quién o en qué confías sin reservas?",
    "El movimiento que se necesita hoy no es apresurado, es rítmico. Ehwaz te enseña el galope que no agota.",

    "El progreso viene de soltar el control excesivo. Ehwaz te invita a bailar con las circunstancias en lugar de luchar contra ellas.",
    "Hay un camino que se abre hoy. Ehwaz te da el impulso para montarlo sin dudar demasiado.",
    "La confianza en el proceso es más valiosa que la certeza del destino. Hoy Ehwaz te recuerda que el viaje forma al viajero.",
    "El caballo sagrado de Odín atraviesa mundos. Hoy Ehwaz te da la capacidad de moverte entre dimensiones de tu vida.",
    "Algo se mueve. Ehwaz confirma: el estancamiento que sentías está cediendo. Hoy el flujo regresa.",
    "Una relación de trabajo, amistad o amor puede profundizarse hoy a través de la acción compartida.",
    "La lealtad es la base de todo movimiento conjunto. Hoy Ehwaz honra a quienes han sido leales contigo.",

    "El ritmo correcto no es el más rápido. Ehwaz te pide que sincronices tu paso con el del universo, no con tu ansiedad.",
    "Algo que llevas tiempo esperando se pone en movimiento. Ehwaz trae acción donde había espera.",
    "La danza entre lo que puedes controlar y lo que no es el arte de la vida. Hoy Ehwaz te da gracia para ese baile.",
    "El ciclo de Ehwaz cierra. Has aprendido que la confianza es la velocidad más alta que existe. Llévala contigo."
  ],
  Mannaz: [
    "Ser humano es un privilegio y una responsabilidad. Hoy Mannaz te invita a habitarlo plenamente, con todo lo que implica.",
    "El autoconocimiento es el viaje más largo y el más valioso. Hoy Mannaz te da una nueva pieza del rompecabezas de ti mismo.",
    "Nadie está completo solo. Mannaz recuerda que la humanidad compartida es la fuente de toda fortaleza colectiva.",
    "Lo que ves en otros, positivo o negativo, vive también en ti. Hoy Mannaz usa el espejo de las relaciones para enseñarte.",
    "Tu mente es tu herramienta más poderosa. Hoy Mannaz te invita a usarla con conciencia, no con automatismo.",
    "Hoy es un buen día para conectar con alguien que piensa diferente a ti. Mannaz se expande en el diálogo honesto.",
    "La comunidad no se construye en los momentos buenos. Se forja en los difíciles. Hoy Mannaz honra a tu tribu.",
    "Conocerte profundamente te hace más compasivo con los demás. Hoy Mannaz trabaja hacia adentro para irradiar hacia afuera.",
    "Tus dones únicos son una contribución necesaria al tejido humano. Hoy Mannaz te pide que no los guardes.",
    "La sabiduría colectiva supera siempre a la individual. Hoy Mannaz te invita a escuchar más y a hablar con más intención.",
    "Lo que te hace humano, con tus contradicciones y tus luces, es exactamente lo que necesitas ser hoy.",
    "Mannaz honra la mente que piensa con claridad y el corazón que siente sin miedo. Hoy integra ambos.",
    "Hay una conversación que puede cambiar la perspectiva de alguien. Hoy Mannaz te da las palabras exactas.",
    "Tu historia personal es parte de la historia colectiva. Hoy Mannaz te recuerda que lo que sanas en ti, lo sanas en todos.",
    "El ciclo de Mannaz cierra. Te vas más consciente de quién eres en relación a los demás. Ese es el regalo más grande."
  ],
  Laguz: [
    "Las aguas de Laguz saben encontrar su camino aunque no haya ninguno visible. Hoy confía en tu capacidad de fluir.",
    "Tu intuición es un río subterráneo que siempre corre. Hoy Laguz sube esas aguas a la superficie. Escúchalas.",
    "Las emociones que evitas se convierten en la corriente que más te arrastra. Hoy Laguz te invita a nadar con ellas.",
    "La profundidad del océano es igual de real que su superficie. Hoy Laguz te invita a explorar lo que está debajo.",
    "El agua no lucha contra los obstáculos, los rodea. Hoy Laguz te enseña la inteligencia de la flexibilidad.",
    "Hoy puede surgir algo desde tu subconsciente: un sueño, una sensación, una intuición. Laguz lo trae a la luz.",
    "Las mareas cambian sin preguntar. Hoy Laguz te recuerda que resistir el cambio emocional cuesta más que fluir con él.",
    "Tu sensibilidad no es un defecto, es un superpoder. Laguz celebra la capacidad de sentir como una forma de conocer.",
    "El agua que sostiene también puede ahogarte si te resistes a ella. Hoy Laguz te enseña a dejarte llevar con conciencia.",
    "Hay algo en tu vida que necesita más fluidez y menos estructura. Laguz hoy afloja lo que estaba demasiado rígido.",
    "La luna guía las mareas. Hoy Laguz te conecta con los ciclos lunares y la sabiduría de lo cíclico.",
    "Una emoción que guardaste mucho tiempo quiere ser sentida. Laguz crea el espacio seguro para que la dejes fluir.",
    "El agua siempre encuentra el nivel. Hoy Laguz equilibra lo que estaba en desequilibrio emocional.",
    "Tu mundo interior es tan vasto como el océano. Hoy Laguz te da el coraje de zambullirte en él sin miedo.",
    "El ciclo de Laguz cierra. Llevas la fluidez del agua: la capacidad de adaptarte, sentir y fluir hacia donde la vida te lleva."
  ],
  Inguz: [
    "Toda semilla lleva dentro de sí el árbol completo. Hoy Inguz confirma: el potencial que sientes ya es real.",
    "El período de gestación no es inactividad. Inguz trabaja en silencio, acumulando la energía para el gran salto.",
    "Hoy no necesitas mostrar resultados. Inguz honra el proceso invisible que precede a todo lo que se manifiesta.",
    "Algo en ti está madurando. Inguz protege ese proceso y te pide que no lo presiones antes de tiempo.",
    "El dios Ing es el fertilizador de todo lo que está por nacer. Hoy siente esa energía de posibilidad vibrando en tu vida.",
    "La energía que acumulas en los momentos de aparente quietud es el combustible de tus próximas acciones. Inguz lo sabe.",
    "Confía en lo que estás construyendo aunque aún no sea visible para nadie más. Inguz ve el potencial completo.",
    "Hoy puede ser el momento en que algo interno se consolida antes de manifestarse. Inguz marca ese instante.",

    "Hay una semilla que plantaste hace tiempo a punto de brotar. Inguz lo anuncia: pronto verás los primeros brotes.",
    "El potencial sin acción es solo posibilidad. Hoy Inguz te da el impulso para hacer ese primer movimiento hacia tu sueño.",

    "El ciclo de gestación de Inguz se acerca a su fin. Lo que has estado preparando está casi listo para nacer.",
    "Inguz cierra su período con una promesa: todo lo que preparaste con amor y paciencia encontrará su momento de florecer."
  ],
  Othila: [
    "Las raíces no limitan al árbol, lo sostienen. Hoy Othila te invita a honrar de dónde vienes para saber a dónde vas.",

    "Lo que legamos importa tanto como lo que recibimos. Hoy Othila te pregunta qué quieres dejar como huella en el mundo.",
    "La sabiduría de los ancestros vive en tu sangre. Hoy Othila te conecta con esa guía silenciosa que siempre estuvo ahí.",
    "Un patrón familiar puede hacerse evidente hoy. Othila te da claridad para decidir qué continuar y qué transformar.",
    "El patrimonio más valioso es el de los valores que te formaron. Hoy Othila te invita a honrar los que siguen siendo tuyos.",
    "Hay algo de tu historia personal que merece ser rescatado, no negado. Othila integra el pasado en lugar de borrarlo.",
    "La tierra de tus ancestros habla en tus genes. Hoy Othila despierta esa memoria corporal que guarda sabiduría milenaria.",
    "Proteger lo que es tuyo, lo que pertenece a tu linaje, es un acto sagrado. Othila te da el instinto para reconocerlo.",
    "La identidad no es una cárcel, es una raíz. Hoy Othila te muestra la diferencia entre pertenecer y estar atrapado.",
    "Algo que viene de tu familia, tu cultura o tu historia puede ser exactamente lo que necesitas hoy. Othila lo trae.",
    "El hogar que construyes hoy es el legado que dejas mañana. Othila te recuerda la sacralidad de lo cotidiano.",
    "El ciclo de Othila cierra. Llevas contigo el mapa de tus raíces: no para quedarte en el pasado, sino para crecer desde él."
  ],
  Dagaz: [
    "El amanecer de Dagaz rompe la oscuridad más larga. Hoy algo en ti despierta a una nueva comprensión. Ábrele la puerta.",
    "Estás en el umbral entre lo que eras y lo que estás siendo. Dagaz marca ese instante mágico. No lo apresures, vívelo.",
    "La transformación que promete Dagaz no pide que lo viejo muera, pide que se integre en algo más luminoso.",
    "Hoy puede llegarte una revelación o una claridad repentina que cambia cómo ves una situación. Dagaz trabaja así.",

// ── Buscar la runa según la fecha ───────────────────────────────────
function getRunaParaFecha(dia, mes) {
  return CALENDARIO.find(e => e.d === dia && e.m === mes);
}

// ── Posición dentro del bloque de esa runa (para elegir mensaje) ────
function getPosicionEnBloque(dia, mes, nombreRuna) {
  const bloque = CALENDARIO.filter(e => e.r === nombreRuna);
  const idx = bloque.findIndex(e => e.d === dia && e.m === mes);
  return idx; // 0-based
}

async function getFechaServidor() {
  try {
    const r = await fetch('https://worldtimeapi.org/api/ip');
    const d = await r.json();
    return new Date(d.datetime);
  } catch {
    return new Date();
  }
}

function formatFecha(fecha) {
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${dias[fecha.getDay()]} ${fecha.getDate()} de ${meses[fecha.getMonth()]} de ${fecha.getFullYear()}`;
}

(async () => {
  const fecha = await getFechaServidor();
  document.getElementById('fecha-display').textContent = formatFecha(fecha);

  const dia = fecha.getDate();
  const mes = fecha.getMonth() + 1; // JS: 0-based

  const entrada = getRunaParaFecha(dia, mes);

  if (!entrada) {
    document.getElementById('error-state').style.display = 'block';
    return;
  }

  const nombre = entrada.r;
  const simbolo = SIMBOLOS[nombre] || '?';
  const posicion = getPosicionEnBloque(dia, mes, nombre);
  const mensajes = MENSAJES[nombre] || [];
  const mensaje = mensajes[posicion] || mensajes[0] || 'El oráculo guarda silencio hoy.';

  document.getElementById('rune-sym').textContent = simbolo;
  document.getElementById('rune-nombre').textContent = nombre.toUpperCase();
  document.getElementById('msg-text').textContent = mensaje;

  document.getElementById('rune-center').style.display = 'block';
  document.getElementById('ornament').style.display = 'flex';
  document.getElementById('msg-wrapper').style.display = 'block';
})();
</script>
