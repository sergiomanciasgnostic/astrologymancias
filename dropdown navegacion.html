<!-- MENÚ SERGIOMANCIAS — pegar en Custom Code > Head -->
<style>
  #sgNav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 99999;
    display: flex;
    justify-content: center;
    padding: 8px 16px;
    background: transparent;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #sgNavWrap {
    position: relative;
    min-width: 220px;
    max-width: 92vw;
  }
  #sgNavBtn {
    width: 100%;
    background: transparent;
    color: #FF6A00;
    border: 1.5px solid #FF6A00;
    border-radius: 6px;
    padding: 7px 36px 7px 14px;
    font-size: 15px;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    outline: none;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color .2s, box-shadow .2s;
    box-sizing: border-box;
  }
  #sgNavBtn:hover { border-color: #ffaa55; }
  #sgNavBtn .sg-arrow {
    position: absolute;
    right: 12px;
    top: 50%; transform: translateY(-50%);
    width: 10px; height: 6px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid #FF6A00;
    transition: transform .2s;
  }
  #sgNavBtn.open .sg-arrow { transform: translateY(-50%) rotate(180deg); }
  #sgNavList {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #1a0a2e;
    border: 1.5px solid #FF6A00;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    z-index: 100000;
  }
  #sgNavList.open { display: block; }
  .sg-item {
    display: block;
    width: 100%;
    padding: 9px 14px;
    color: #FF6A00;
    background: transparent;
    border: none;
    font-size: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    cursor: pointer;
    box-sizing: border-box;
    transition: background .15s, color .15s;
    letter-spacing: .03em;
  }
  .sg-item:hover { background: rgba(255,106,0,0.12); color: #ffaa55; }
  .sg-item + .sg-item { border-top: 1px solid rgba(255,106,0,0.15); }
  @media (max-width: 600px) {
    #sgNav { padding: 6px 10px; }
    #sgNavBtn { font-size: 13px; padding: 6px 32px 6px 10px; }
    #sgNavWrap { min-width: 180px; }
    .sg-item { font-size: 13px; padding: 8px 10px; }
  }
</style>

<nav id="sgNav">
  <div id="sgNavWrap">
    <button id="sgNavBtn" onclick="sgNavToggle()">
      ✦ Navegar ✦
      <span class="sg-arrow"></span>
    </button>
    <div id="sgNavList">
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic')">Inicio · Lecturas</button>
      <button class="sg-item" onclick="sgNavGo('lightbox:Lectura Transcurso Vital Prices')">Transcurso Vital ↗</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/astrologia')">Astrología y Otras Mancias</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/bindrunesrunasenlazadas')">Bindrunes · Runas Enlazadas</button>
      <button class="sg-item" onclick="sgNavGo('lightbox:Horóscopo Egipcio')">Tu Horóscopo Egipcio ↗</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/eticadeltarot')">Saber más sobre las mancias</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/sobremi')">Sobre mí</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/origenyproposito')">Origen y Propósito</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/cartografiadeloinvisible')">Cartografía de lo Invisible</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/comentarios')">Comentarios</button>
      <button class="sg-item" onclick="sgNavGo('https://sergiomanciasgnostic.wixsite.com/sergiomanciasgnostic/contacto')">Contacto</button>
    </div>
  </div>
</nav>

<script>
function sgNavToggle() {
  var btn  = document.getElementById('sgNavBtn');
  var list = document.getElementById('sgNavList');
  btn.classList.toggle('open');
  list.classList.toggle('open');
}
function sgNavGo(val) {
  document.getElementById('sgNavBtn').classList.remove('open');
  document.getElementById('sgNavList').classList.remove('open');
  if (val.startsWith('lightbox:')) {
    var name = val.replace('lightbox:', '');
    if (typeof wixWindow !== 'undefined') {
      wixWindow.openLightbox(name);
    } else if (typeof Wix !== 'undefined' && Wix.openModal) {
      Wix.openModal(name);
    }
  } else {
    // window.top escapa del iframe de Wix y redirige la página completa
    window.top.location.href = val;
  }
}
document.addEventListener('click', function(e) {
  var wrap = document.getElementById('sgNavWrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('sgNavBtn').classList.remove('open');
    document.getElementById('sgNavList').classList.remove('open');
  }
});
</script>
